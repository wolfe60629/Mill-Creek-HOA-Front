name: GitHub Pages

on:
  push:
    branches:
    - main
    - release/4.2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install --f

    # - name: Run tests
    #   run: npm run test:headless

    - name: Build
      run: npm run build:prod


    - name: Deploy
      run: npm run deploy