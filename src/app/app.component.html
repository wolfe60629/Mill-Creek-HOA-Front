<div class="app-shell">
  <div class="global-hero-background" aria-hidden="true">
    <img src="assets/background.png" alt="" class="global-background-image">
    <div class="global-overlay"></div>
  </div>

  <app-navigation>
    <main class="app-main" [class.app-main--scroll]="isScrollSite">
      <p-toast position="bottom-center"></p-toast>
      <p-confirmDialog key="confirm"></p-confirmDialog>
      <router-outlet></router-outlet>
    </main>

    <app-footer *ngIf="!isScrollSite"></app-footer>
  </app-navigation>
</div>
