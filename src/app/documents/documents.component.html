<div class="documents-container">
  <!-- Hero Section -->
  <div class="hero-section">
    <div class="hero-content">
      <h1 class="hero-title">Community Documents</h1>
      <p class="hero-subtitle">Access important community information and resources</p>
    </div>
  </div>

  <!-- Main Content -->
  <div class="content-section">
    <div class="container">
      <!-- File Upload (Admin Only) -->
      <div class="upload-section" *ngIf="isAdmin">
        <div class="upload-card">
          <h3 class="section-title">Upload Document</h3>
          <div class="file-upload">
            <input type="file"
                   accept="application/pdf"
                   id="file"
                   #fileInput
                   (change)="handleFileInput(fileInput.files)"
                   class="file-input">
            <label for="file" class="file-label">
              <span class="upload-icon">📄</span>
              <span class="upload-text">Choose PDF File</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Document Categories -->
      <div class="documents-section" *ngIf="documents.length > 0">
        <div class="documents-card">
          <h3 class="section-title">Document Library</h3>
          <p-accordion class="modern-accordion">
            <p-accordionTab *ngFor="let currCategory of listOfCategories; let j=index" 
                           [header]="currCategory" 
                           [selected]="j==0">
              <div class="documents-grid">
                <ng-container *ngFor="let document of documents">
                  <div *ngIf="document.category == currCategory"
                       class="document-item"
                       (click)="showFile(document.id)">
                    <div class="document-icon">📋</div>
                    <div class="document-content">
                      <h4 class="document-title">{{ document.friendlyName }}</h4>
                      <p class="document-description">{{ document.description }}</p>
                    </div>
                    <div class="document-actions">
                      <button *ngIf="isAdmin" 
                              class="delete-btn" 
                              pTooltip="Delete Document" 
                              (click)="onDelete(document)">
                        🗑️
                      </button>
                      <div class="document-arrow">→</div>
                    </div>
                  </div>
                </ng-container>
              </div>
            </p-accordionTab>
          </p-accordion>
        </div>
      </div>

      <!-- No Documents Message -->
      <div class="no-documents" *ngIf="documents.length === 0">
        <div class="no-documents-card">
          <div class="no-documents-icon">📚</div>
          <h3>No Documents Available</h3>
          <p>Check back later for community documents and resources.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Document Upload Modal -->
<app-document-upload *ngIf="fileToUpload!=null" 
                     [fileToUpload]="fileToUpload" 
                     [showUploadModal]="showUploadModal">
</app-document-upload>

<!-- Document Viewer Modal -->
<app-viewer [(showViewerModal)]="showViewerModal" 
            [(manifestHtml)]="mainfestHtml">
</app-viewer>

<!-- Confirm Dialog -->
<p-confirmDialog key="confirm">
  <input type="text">
</p-confirmDialog>
