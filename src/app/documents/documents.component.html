<div class="scroll-panel glass-panel page-sheet--wide" appScrollReveal>
  <div class="docs-layout">
    <div class="docs-upload" *ngIf="isAdmin" appScrollReveal>
      <div class="docs-upload-inner">
        <mat-icon class="docs-upload-icon" aria-hidden="true">cloud_upload</mat-icon>
        <div class="docs-upload-copy">
          <div class="docs-upload-head">
            <h3 class="docs-upload-title">Upload a document</h3>
            <span class="admin-badge">Board edit mode</span>
          </div>
          <p class="docs-upload-hint">PDF only · 5 MB max</p>
        </div>
        <div class="file-upload">
          <input
            type="file"
            accept="application/pdf"
            id="file"
            #fileInput
            (change)="handleFileInput(fileInput.files)"
            class="file-input">
          <label for="file" class="file-label">Choose file</label>
        </div>
      </div>
    </div>

    <div class="docs-categories" *ngIf="documents.length > 0">
      <section
        *ngFor="let category of listOfCategories; let j = index"
        class="docs-category"
        [class.docs-category--open]="isCategoryExpanded(category)"
        appScrollReveal
        [scrollRevealDelay]="j * 70">
        <button
          type="button"
          class="docs-category-head"
          (click)="toggleCategory(category)"
          [attr.aria-expanded]="isCategoryExpanded(category)">
          <mat-icon class="docs-category-folder" aria-hidden="true">folder_open</mat-icon>
          <h3 class="docs-category-title">{{ category }}</h3>
          <span class="docs-category-count">{{ documentsForCategory(category).length }}</span>
          <mat-icon class="docs-category-chevron" aria-hidden="true">
            {{ isCategoryExpanded(category) ? 'expand_less' : 'expand_more' }}
          </mat-icon>
        </button>

        <ul class="docs-list" *ngIf="isCategoryExpanded(category)">
          <li
            *ngFor="let document of documentsForCategory(category)"
            class="docs-item"
            [class.docs-item--editing]="documentEditingEnabled && isEditing(document)">
            <ng-container *ngIf="!documentEditingEnabled || !isEditing(document); else editDocForm">
              <div class="docs-item-main">
                <button
                  type="button"
                  class="docs-row"
                  (click)="showFile(document.id)">
                  <span class="docs-row-icon" aria-hidden="true">
                    <mat-icon>picture_as_pdf</mat-icon>
                  </span>
                  <span class="docs-row-body">
                    <span class="docs-row-title">{{ document.friendlyName }}</span>
                    <span class="docs-row-desc" *ngIf="document.description">{{ document.description }}</span>
                  </span>
                  <mat-icon class="docs-row-arrow" aria-hidden="true">chevron_right</mat-icon>
                </button>
                <div *ngIf="isAdmin" class="inline-actions">
                  <button
                    *ngIf="documentEditingEnabled"
                    type="button"
                    class="inline-action-btn"
                    pTooltip="Edit document"
                    aria-label="Edit document"
                    (click)="onEditClick($event, document)">
                    <mat-icon aria-hidden="true">edit</mat-icon>
                  </button>
                  <button
                    type="button"
                    class="inline-action-btn inline-action-btn--danger"
                    pTooltip="Delete document"
                    aria-label="Delete document"
                    (click)="onDeleteClick($event, document)">
                    <mat-icon aria-hidden="true">delete_outline</mat-icon>
                  </button>
                </div>
              </div>
            </ng-container>

            <ng-template #editDocForm>
              <div class="docs-edit-form admin-form">
                <label class="form-label" for="doc-edit-name-{{ document.id }}">Document name</label>
                <input
                  id="doc-edit-name-{{ document.id }}"
                  type="text"
                  class="form-input"
                  [(ngModel)]="editFriendlyName" />
                <label class="form-label" for="doc-edit-desc-{{ document.id }}">Description</label>
                <textarea
                  id="doc-edit-desc-{{ document.id }}"
                  rows="2"
                  class="form-input"
                  [(ngModel)]="editDescription"></textarea>
                <div class="form-actions">
                  <button type="button" class="save-btn" (click)="saveEdit(document)">Save</button>
                  <button type="button" class="cancel-btn" (click)="cancelEdit()">Cancel</button>
                </div>
              </div>
            </ng-template>
          </li>
        </ul>
      </section>
    </div>

    <div class="docs-empty" *ngIf="documents.length === 0" appScrollReveal>
      <mat-icon aria-hidden="true">description</mat-icon>
      <h3>No documents yet</h3>
      <p>HOA bylaws, forms, and community records will appear here when published.</p>
    </div>
  </div>
</div>

<app-document-upload
  *ngIf="showUploadModal && fileToUpload"
  [file]="fileToUpload"
  [categoryOptions]="listOfCategories"
  (uploaded)="onDocumentUploaded()"
  (closed)="closeUploadModal()">
</app-document-upload>

<app-viewer
  *ngIf="showViewerModal"
  [(showViewerModal)]="showViewerModal"
  [(manifestHtml)]="mainfestHtml"
  [documentTitle]="viewerDocumentTitle">
</app-viewer>
