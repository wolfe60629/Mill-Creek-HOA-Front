<div
  #pdfOverlay
  class="pdf-overlay"
  [class.is-open]="showViewerModal"
  [attr.aria-hidden]="!showViewerModal"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="documentTitle || 'Document viewer'">
  <div class="pdf-overlay-backdrop" (click)="closeViewer()"></div>

  <div class="pdf-shell" id="pdfViewerShell">
    <header class="pdf-chrome">
      <mat-icon class="pdf-chrome-icon" aria-hidden="true">description</mat-icon>
      <h2 class="pdf-chrome-title">{{ documentTitle || 'Document' }}</h2>
      <div class="pdf-chrome-spacer"></div>
      <button type="button" class="pdf-chrome-btn pdf-chrome-btn-close" (click)="closeViewer()" aria-label="Close viewer">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </header>

    <div class="pdf-body" *ngIf="showViewerModal">
      <ngx-extended-pdf-viewer
        [showOpenFileButton]="false"
        [showSidebarButton]="false"
        [showRotateButton]="false"
        [showPropertiesButton]="false"
        [showFindButton]="false"
        [showPagingButtons]="true"
        [showZoomButtons]="true"
        [showPresentationModeButton]="false"
        [showDownloadButton]="false"
        [showPrintButton]="false"
        [showSecondaryToolbarButton]="false"
        [showSpreadButton]="false"
        [showScrollingButton]="false"
        [showHandToolButton]="false"
        [textLayer]="true"
        [useBrowserLocale]="true"
        [mobileFriendlyZoom]="true"
        [zoom]="zoom"
        [theme]="'light'"
        [base64Src]="src"
        [height]="'100%'"
        class="embedded-pdf"
      ></ngx-extended-pdf-viewer>
    </div>
  </div>
</div>
