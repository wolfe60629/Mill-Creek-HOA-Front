<!-- Reworked full-screen PDF overlay -->
<div class="pdf-overlay" *ngIf="showViewerModal">
  <div class="pdf-shell" id="pdfViewerShell">
    <div class="pdf-toolbar">
      <div class="pdf-title">Document Viewer</div>
      <div class="pdf-toolbar-spacer"></div>
      <button type="button" class="pdf-btn" (click)="toggleFullScreen()" aria-label="Fullscreen">⛶</button>
      <button type="button" class="pdf-btn" (click)="closeViewer()" aria-label="Close">✕</button>
    </div>
    <div class="pdf-body">
      <ngx-extended-pdf-viewer
        [showOpenFileButton]="false"
        [showSidebarButton]="true"
        [showRotateButton]="true"
        [showPropertiesButton]="false"
        [showFindButton]="true"
        [textLayer]="true"
        [useBrowserLocale]="true"
        [mobileFriendlyZoom]="true"
        [zoom]="zoom"
        [theme]="'light'"
        [base64Src]="src"
        [height]="'100%'"
        class="embedded-pdf"
      ></ngx-extended-pdf-viewer>
    </div>
  </div>
  <div class="pdf-overlay-backdrop" (click)="closeViewer()"></div>
</div>
