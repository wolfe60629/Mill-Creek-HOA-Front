<div class="login-page page-enter">
  <div class="login-card animate-in animate-in-delay-1">
    <h1 class="login-title">Board sign-in</h1>
    <p class="login-subtitle">For Mill Creek board members and administrators.</p>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" class="login-input" [(ngModel)]="username" name="username" type="text" placeholder="Your username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" class="login-input" [(ngModel)]="password" name="password" type="password" placeholder="Your password" autocomplete="current-password" />
      </div>

      <button type="submit" class="submit-btn">Sign in</button>
    </form>
  </div>
</div>
